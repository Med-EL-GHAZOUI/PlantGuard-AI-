# Lancement : docker compose up --build        (application sur http://localhost:8080)
# Le modèle n'est PAS dans l'image (trop lourd, non versionné) : il est monté en lecture seule.
#   MODEL_DIR=./ml/artifacts/final   (défaut) — dossier produit par `python -m ml.export.export_model`
#   FRONTEND_PORT=8080               (défaut)
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PLANTGUARD_RATE_LIMIT_PER_MINUTE: "0"   # fait par nginx, par client (le backend ne voit que l'adresse de nginx)
      PLANTGUARD_ENABLE_DOCS: "${ENABLE_DOCS:-0}"
    volumes:
      - ${MODEL_DIR:-./ml/artifacts/final}:/models:ro
      - plantguard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # aucun port publié : seul nginx joint le backend, via le réseau interne

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  plantguard-data:
