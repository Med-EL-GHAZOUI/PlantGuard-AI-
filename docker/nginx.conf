# Limitation de débit PAR CLIENT (le backend ne voit que l'adresse de nginx, donc c'est ici qu'elle se fait)
limit_req_zone $binary_remote_addr zone=predict:10m rate=30r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Mêmes en-têtes que scripts/run_dev.py : CSP stricte, requêtes limitées au site lui-même
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 6m;   # un peu plus que la limite applicative (5 Mo) pour laisser le backend répondre 413 proprement

    location = /api/predict {
        limit_req zone=predict burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/plantguard_proxy.conf;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/plantguard_proxy.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
